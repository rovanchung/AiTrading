trading:
  buy_threshold: 68
  purchase_power_pct: 0.75      # 50% of portfolio value for redistribution
  cooldown_hours: 8             # hours before re-buying a profit/loss sold ticker
  paper_trading: true
  cash_only: true                # cap buys at available cash; avoid margin borrowing
  cash_slippage_buffer: 0.005    # reserve 0.5% of cash for fill-price slippage
  # Anti-churn ("v2") strategy parameters:
  v2_profit_take_pct: 0.03      # +3% from Alpaca avg cost -> sell
  v2_loss_cut_pct: 0.02         # -2% from Alpaca avg cost -> sell
  # Prior-close triggers. 0 = disabled. Compared against the last
  # observed price on the most recent prior date in daily_holding_prices.
  v2_profit_take_vs_prior_close_pct: 0.0
  v2_loss_cut_vs_prior_close_pct: 0.0
  v2_min_hold_minutes: 30       # don't sell until held for this long
  v2_sell_threshold: 58         # score must drop below this to trigger no_longer_qualifies
  # no_longer_qualifies debounce. 0 disables that rule; if both are 0,
  # behavior falls back to single-data-point trigger. If either is set,
  # EITHER rule meeting its condition triggers the sell:
  #   - consecutive: require N consecutive sub-threshold scores
  #   - ma_window:   sell if the avg of the last M scores is below threshold
  v2_no_longer_qualifies_consecutive: 0
  v2_no_longer_qualifies_ma_window: 0
  v2_rebalance_min_share_diff: 1.0  # skip redistribution trades unless |target$-current$|/price > this many shares

scoring:
  technical_weight: 0.35
  fundamental_weight: 0.25
  momentum_weight: 0.25
  sentiment_weight: 0.15

screener:
  min_price: 5.0
  max_price: 500.0
  min_avg_volume: 500000
  min_market_cap: 2000000000
  universe: "sp500"
  custom_tickers: []

schedule:
  market_open: "09:30"
  market_close: "16:00"
  prep_minutes_before_open: 5
  scan_interval_minutes: 60
  rerank_interval_minutes: 1
  shortlist_size: 80

fundamentals:
  staleness_days: 80          # skip API call if data is < 80 days old

data:
  primary: "alpaca"
  history_period: "3mo"
  universe_refresh_days: 7

macro:
  enabled: true
  cache_ttl_hours: 4

logging:
  level: "INFO"
  file: "data/logs/main.log"
  max_size_mb: 50
  backup_count: 5

accounts:
  # Alpaca credentials are picked per-account in .env. For each V3-V4,
  # set ALPACA_ACCOUNT_V{N}=<suffix> to point at the credential pair
  # ALPACA_API_KEY_{suffix} / ALPACA_SECRET_KEY_{suffix}. If unset, the
  # legacy convention (suffix == version, e.g. ALPACA_API_KEY_V3) applies.
  v3:
    database_path: "data/trading_v3.db"
    v2_profit_take_pct: 0.2
    v2_profit_take_vs_prior_close_pct: 0.05
    v2_loss_cut_pct: 0.02
    v2_loss_cut_vs_prior_close_pct: 0.02
    v2_min_hold_minutes: 0
    v2_sell_threshold: 65
    v2_no_longer_qualifies_consecutive: 4   # debounce score-based exits
  v4:
    database_path: "data/trading_v4.db"
    v2_profit_take_pct: 0.05
    v2_loss_cut_pct: 0.03
    v2_min_hold_minutes: 0
    account_overrides:
      # Per-Alpaca-account overrides (selected by --account <suffix>, lowercased).
      # Merged on top of the v4 trading params above.
      v4_2:
        v2_sell_threshold: 55              # 58 → 55: less score-driven churn
        v2_rebalance_min_share_diff: 2.0   # 1.0 → 2.0: fewer micro-rebalances
        max_sector_pct: 0.20               # cap any sector at 20% of slots (default 0.30)
        max_pct_per_position: 0.05         # cap a single name at 5% of equity
